<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Shorts AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#10131b;color:#f4f6fb;font-family:Arial,sans-serif}
    main{max-width:760px;margin:28px auto;padding:18px}
    .panel{background:#1a2030;border:1px solid #30394d;border-radius:18px;padding:22px}
    h1{margin:0 0 8px;font-size:28px}p{color:#b8c1d4;line-height:1.5}
    label{display:block;margin:18px 0 7px;font-weight:700}
    input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #46516a;background:#111827;color:#fff;font-size:15px}
    input[type=file]{padding:10px}button{margin-top:20px;background:#6d5dfc;border:0;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6}small{color:#aab4c8}.status{margin-top:18px;padding:13px;border-radius:10px;background:#111827;white-space:pre-wrap}
    progress{width:100%;height:12px;margin-top:12px}
    a{color:#a99fff}
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>Auto Shorts AI</h1>
    <p>अपना वीडियो अपलोड करके छोटे 9:16 क्लिप बनाएं। YouTube watch-page लिंक सीधे डाउनलोड नहीं होता। केवल अपना वीडियो या अनुमति वाला वीडियो इस्तेमाल करें।</p>
    <form id="jobForm">
      <label for="video">वीडियो फ़ाइल अपलोड करें</label>
      <input id="video" name="video" type="file" accept="video/*">

      <label for="youtube_url">YouTube लिंक (सिर्फ़ संदर्भ के लिए)</label>
      <input id="youtube_url" name="youtube_url" type="url" placeholder="https://www.youtube.com/watch?v=...">

      <label for="video_url">सीधा वीडियो फ़ाइल URL (HTTPS)</label>
      <input id="video_url" name="video_url" type="url" placeholder="https://example.com/video.mp4">

      <label for="count">कितने क्लिप बनाने हैं?</label>
      <select id="count" name="count">
        <option>10</option><option>12</option><option>15</option><option>18</option><option>20</option>
      </select>

      <label for="clip_length">हर क्लिप की लंबाई</label>
      <select id="clip_length" name="clip_length">
        <option value="20">20 सेकंड</option><option value="30" selected>30 सेकंड</option>
        <option value="35">35 सेकंड</option><option value="45">45 सेकंड</option><option value="60">60 सेकंड</option>
      </select>

      <label for="model">Caption मॉडल</label>
      <select id="model" name="model">
        <option value="tiny">Tiny — तेज़</option><option value="base" selected>Base — संतुलित</option><option value="small">Small — बेहतर पहचान</option>
      </select>

      <button id="submitBtn" type="submit">Generate Shorts</button>
    </form>
    <div id="status" class="status" aria-live="polite">अभी कोई काम शुरू नहीं हुआ है।</div>
    <progress id="progress" value="0" max="100"></progress>
  </section>
</main>
<script>
const form=document.getElementById('jobForm');
const statusBox=document.getElementById('status');
const progress=document.getElementById('progress');
const button=document.getElementById('submitBtn');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(!document.getElementById('video').files.length &&
     !document.getElementById('video_url').value.trim()){
    statusBox.textContent='कृपया वीडियो फ़ाइल अपलोड करें या सीधा वीडियो URL दें। YouTube watch लिंक अकेले काम नहीं करेगा।';
    return;
  }
  button.disabled=true; progress.value=0; statusBox.textContent='वीडियो भेजा जा रहा है...';
  try{
    const response=await fetch('/api/jobs',{method:'POST',body:new FormData(form)});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||'वीडियो भेजने में समस्या हुई।');
    statusBox.textContent='काम शुरू हो गया है...';
    while(true){
      await sleep(2500);
      const r=await fetch('/api/jobs/'+encodeURIComponent(data.job_id));
      const job=await r.json();
      if(!r.ok) throw new Error(job.error||'Job की स्थिति नहीं मिली।');
      progress.value=job.progress||0;
      statusBox.textContent=(job.message||job.status)+'\nस्थिति: '+job.status+'\nप्रगति: '+(job.progress||0)+'%';
      if(job.status==='done'){
        statusBox.innerHTML='आपके क्लिप तैयार हैं। <a href="'+job.download+'">ZIP डाउनलोड करें</a>';
        break;
      }
      if(job.status==='error') throw new Error(job.message||'Processing में समस्या हुई।');
    }
  }catch(error){statusBox.textContent='त्रुटि: '+error.message;}
  finally{button.disabled=false;}
});
</script>
</body>
</html>
